
allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"

    if (project.name.startsWith('google_maps_flutter_android')) {
        project.ext.set('compileSdkVersion', 36)
    }
    if (project.name.startsWith('geolocator')) {
        project.ext.set('compileSdkVersion', 36)
    }    
    if (project.name.startsWith('app_links')) {
        project.ext.set('compileSdkVersion', 36)
    } 
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}