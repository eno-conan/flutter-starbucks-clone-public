name: testingapp
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.5+2001

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: 3.44.0

dependencies:
  flutter:
    sdk: flutter

  animated_bottom_navigation_bar: ^1.4.0
  app_links: ^7.0.0
  cached_network_image: ^3.4.1
  carousel_slider: ^5.1.2
  connectivity_plus: ^7.1.1
  device_info_plus: ^12.4.0
  custom_info_window: ^1.0.1
  dio: ^5.9.2
  envied: ^1.3.5
  firebase_core: ^4.9.0
  firebase_crashlytics: ^5.2.2
  firebase_messaging: ^16.2.2
  firebase_performance: ^0.11.3
  flutter_hooks: ^0.21.3
  flutter_launcher_icons: ^0.14.4
  flutter_local_notifications: ^21.0.0
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.4.7
  flutter_riverpod: ^3.3.1
  flutter_secure_storage: ^10.2.0
  go_router: ^17.3.0
  google_maps_flutter: ^2.17.0  
  http: ^1.5.0
  intl: any
  local_auth: ^3.0.1
  logger: ^2.7.0
  no_screenshot: ^1.0.0
  package_info_plus: ^9.0.0
  qr_flutter: ^4.1.0
  riverpod_annotation: ^4.0.2
  screen_brightness: ^2.1.8
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.12.2
  url_launcher: ^6.3.1
  vector_graphics: ^1.2.2
  vector_graphics_compiler: ^1.2.3
  geolocator: ^14.0.2
  sqflite: ^2.4.2
  path: ^1.9.1
  cupertino_icons: ^1.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  build_runner: ^2.15.0
  envied_generator: ^1.3.5
  mockito: ^5.6.4
  mocktail: ^1.0.5

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    # - .env  
    - assets/
    - assets/starbucks/png/
    - assets/fonts/NotoSansJP/
    - assets/fonts/Roboto/
    - assets/fonts/MaterialIcons-Regular.otf
    # Applies the transformer to the folder containing SVGs
    - path: assets/starbucks/svg/
      transformers:
        - package: vector_graphics_compiler

  fonts:
    - family: NotoSansJP
      fonts:
        - asset: assets/fonts/NotoSansJP/NotoSansJP-Regular.otf
          weight: 400     
        - asset: assets/fonts/NotoSansJP/NotoSansJP-Bold.otf
          weight: 700
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto/Roboto-Bold.ttf
          weight: 700

