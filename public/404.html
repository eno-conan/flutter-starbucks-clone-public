<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ページが見つかりません - TODO App</title>

    <style media="screen">
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: #333;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      
      #message {
        background: white;
        max-width: 480px;
        width: 100%;
        padding: 48px 32px;
        border-radius: 16px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        text-align: center;
        animation: slideUp 0.5s ease-out;
      }
      
      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      
      .icon {
        font-size: 80px;
        margin-bottom: 24px;
        animation: float 3s ease-in-out infinite;
      }
      
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }
      
      h1 {
        font-size: 64px;
        font-weight: 700;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 16px;
      }
      
      h2 {
        font-size: 24px;
        font-weight: 600;
        color: #333;
        margin-bottom: 16px;
      }
      
      p {
        font-size: 16px;
        line-height: 1.6;
        color: #666;
        margin-bottom: 32px;
      }
      
      .button-group {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
      }
      
      a {
        display: inline-block;
        padding: 14px 32px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
        font-size: 16px;
        transition: all 0.3s ease;
        cursor: pointer;
      }
      
      .btn-primary {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
      }
      
      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
      }
      
      .btn-secondary {
        background: #f0f0f0;
        color: #333;
      }
      
      .btn-secondary:hover {
        background: #e0e0e0;
        transform: translateY(-2px);
      }
      
      @media (max-width: 600px) {
        body {
          padding: 16px;
        }
        
        #message {
          padding: 32px 24px;
        }
        
        h1 {
          font-size: 48px;
        }
        
        h2 {
          font-size: 20px;
        }
        
        .icon {
          font-size: 60px;
        }
        
        .button-group {
          flex-direction: column;
        }
        
        a {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="message">
      <div class="icon">📋</div>
      <h1>404</h1>
      <h2>ページが見つかりません</h2>
      <p>お探しのページは存在しないか、移動した可能性があります。<br>URLをご確認の上、もう一度お試しください。</p>
      <div class="button-group">
        <a href="/" class="btn-primary">ホームに戻る</a>
        <a href="javascript:history.back()" class="btn-secondary">前のページへ</a>
      </div>
    </div>
  </body>
</html>
