    <linearGradient id="milk12" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF8F0"/>
      <stop offset="60%" stop-color="#F0E0C8"/>
      <stop offset="100%" stop-color="#D4A870"/>
    </linearGradient>
    <linearGradient id="cup12" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F8F8F8"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8E8E8"/>
    </linearGradient>
  </defs>
  <!-- Background -->
