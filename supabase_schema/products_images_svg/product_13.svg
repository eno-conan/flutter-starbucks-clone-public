<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280">
  <defs>
    <linearGradient id="cupGrad13" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f5f5f0"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8e8e3"/>
    </linearGradient>
    <linearGradient id="latteGrad13" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5e6c8"/>
      <stop offset="100%" stop-color="#d4a54a"/>
    </linearGradient>
    <linearGradient id="foamGrad13" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffef5"/>
      <stop offset="100%" stop-color="#f5e6c8"/>
    </linearGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="100" cy="268" rx="52" ry="8" fill="#00000015"/>
  <!-- Cup body -->
  <path d="M55,70 L62,255 C62,262 75,268 100,268 C125,268 138,262 138,255 L145,70 Z" fill="url(#cupGrad13)" stroke="#ddd" stroke-width="0.5"/>
  <!-- Drink fill -->
  <path d="M58,85 L62,255 C62,262 75,268 100,268 C125,268 138,262 138,255 L142,85 Z" fill="url(#latteGrad13)"/>
  <!-- Foam layer -->
  <ellipse cx="100" cy="85" rx="42" ry="12" fill="url(#foamGrad13)"/>
  <!-- Vanilla specks on foam -->
  <circle cx="88" cy="83" r="0.8" fill="#2a1a0a" opacity="0.6"/>
  <circle cx="95" cy="86" r="0.6" fill="#2a1a0a" opacity="0.5"/>
  <circle cx="105" cy="82" r="0.7" fill="#2a1a0a" opacity="0.6"/>
  <circle cx="110" cy="87" r="0.5" fill="#2a1a0a" opacity="0.5"/>
  <circle cx="92" cy="80" r="0.6" fill="#2a1a0a" opacity="0.4"/>
  <circle cx="102" cy="88" r="0.7" fill="#2a1a0a" opacity="0.5"/>
  <circle cx="85" cy="87" r="0.5" fill="#2a1a0a" opacity="0.4"/>
  <circle cx="113" cy="84" r="0.6" fill="#2a1a0a" opacity="0.5"/>
  <circle cx="98" cy="79" r="0.5" fill="#2a1a0a" opacity="0.4"/>
  <circle cx="107" cy="85" r="0.8" fill="#2a1a0a" opacity="0.5"/>
  <!-- Latte art swirl -->
  <path d="M90,84 Q95,80 100,84 Q105,88 110,84" fill="none" stroke="#fffdf0" stroke-width="1.5" opacity="0.7"/>
  <path d="M93,82 Q100,78 107,82" fill="none" stroke="#fffdf0" stroke-width="1" opacity="0.5"/>
  <!-- Green sleeve -->
  <path d="M67,140 L73,200 C73,200 85,204 100,204 C115,204 127,200 127,200 L133,140 Z" fill="#00704A"/>
  <!-- Sleeve logo circle -->
  <circle cx="100" cy="170" r="16" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="100" cy="170" r="13" fill="none" stroke="#ffffff" stroke-width="0.5"/>
  <!-- Simplified siren in logo -->
  <circle cx="100" cy="167" r="3" fill="#ffffff"/>
  <path d="M94,173 Q97,180 100,176 Q103,180 106,173" fill="none" stroke="#ffffff" stroke-width="1.2"/>
  <!-- Cup rim -->
  <ellipse cx="100" cy="70" rx="45" ry="13" fill="#f0f0eb" stroke="#ddd" stroke-width="0.5"/>
  <ellipse cx="100" cy="70" rx="42" ry="11" fill="#ffffff" stroke="#eee" stroke-width="0.3"/>
  <!-- Lid -->
  <path d="M58,65 C58,55 75,48 100,48 C125,48 142,55 142,65" fill="#e0ddd5" stroke="#c5c2ba" stroke-width="0.5"/>
  <ellipse cx="100" cy="65" rx="42" ry="11" fill="#eae7df" stroke="#c5c2ba" stroke-width="0.5"/>
  <!-- Lid drinking hole -->
  <ellipse cx="100" cy="58" rx="8" ry="3" fill="#d5d0c5" stroke="#b5b0a5" stroke-width="0.5"/>
  <!-- Cup highlight -->
  <path d="M70,90 L73,240 C73,240 74,242 75,242" fill="#ffffff" opacity="0.15"/>
</svg>