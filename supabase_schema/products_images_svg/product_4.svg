<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280">
  <defs>
    <linearGradient id="cupBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0ece6"/>
    </linearGradient>
    <linearGradient id="coffee" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a3520"/>
      <stop offset="100%" stop-color="#3b2010"/>
    </linearGradient>
  </defs>
  <!-- Shadow beneath cup -->
  <ellipse cx="100" cy="268" rx="52" ry="8" fill="rgba(0,0,0,0.10)"/>
  <!-- Cup body -->
  <path d="M58,70 L52,255 C52,262 60,268 100,268 C140,268 148,262 148,255 L142,70 Z" fill="url(#cupBody)" stroke="#e0d8cc" stroke-width="1"/>
  <!-- Coffee fill - lighter brown americano -->
  <path d="M62,88 L54,250 C54,257 62,263 100,263 C138,263 146,257 146,250 L138,88 C138,88 130,92 100,92 C70,92 62,88 62,88 Z" fill="url(#coffee)"/>
  <!-- Lighter surface showing diluted coffee -->
  <ellipse cx="100" cy="90" rx="38" ry="8" fill="#6b4428"/>
  <ellipse cx="100" cy="90" rx="36" ry="7" fill="#7a5030" opacity="0.5"/>
  <!-- Light reflection on coffee surface -->
  <ellipse cx="92" cy="89" rx="8" ry="2.5" fill="#8a6040" opacity="0.4"/>
  <!-- Starbucks green sleeve -->
  <path d="M65,140 L60,195 C60,195 70,200 100,200 C130,200 140,195 140,195 L135,140 C135,140 125,145 100,145 C75,145 65,140 65,140 Z" fill="#00704A"/>
  <!-- Sleeve texture -->
  <path d="M72,155 L69,185" stroke="#005c3c" stroke-width="0.5" opacity="0.4"/>
  <path d="M82,157 L79,187" stroke="#005c3c" stroke-width="0.5" opacity="0.4"/>
  <path d="M92,158 L90,188" stroke="#005c3c" stroke-width="0.5" opacity="0.4"/>
  <path d="M102,158 L100,188" stroke="#005c3c" stroke-width="0.5" opacity="0.4"/>
  <path d="M112,158 L110,188" stroke="#005c3c" stroke-width="0.5" opacity="0.4"/>
  <path d="M122,157 L120,187" stroke="#005c3c" stroke-width="0.5" opacity="0.4"/>
  <path d="M132,155 L130,185" stroke="#005c3c" stroke-width="0.5" opacity="0.4"/>
  <!-- Starbucks logo -->
  <circle cx="100" cy="168" r="16" fill="#00704A" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="100" cy="168" r="12" fill="none" stroke="#ffffff" stroke-width="0.5"/>
  <path d="M100,158 C97,158 95,160 95,163 C95,166 96,168 98,170 C96,172 95,174 95,176 C95,178 97,179 100,179 C103,179 105,178 105,176 C105,174 104,172 102,170 C104,168 105,166 105,163 C105,160 103,158 100,158 Z" fill="#ffffff" opacity="0.9"/>
  <!-- Cup rim -->
  <ellipse cx="100" cy="70" rx="42" ry="9" fill="#f5f0e8" stroke="#e0d8cc" stroke-width="1"/>
  <ellipse cx="100" cy="70" rx="38" ry="7" fill="#ffffff"/>
  <!-- Lid -->
  <path d="M58,65 C58,55 70,50 100,50 C130,50 142,55 142,65 L142,72 C142,72 130,78 100,78 C70,78 58,72 58,72 Z" fill="#f5f0e8" stroke="#ddd5c8" stroke-width="1"/>
  <ellipse cx="100" cy="55" rx="38" ry="8" fill="#ffffff" stroke="#ddd5c8" stroke-width="0.5"/>
  <ellipse cx="100" cy="53" rx="8" ry="3" fill="#e8e0d5"/>
  <!-- Steam - slightly lighter/more visible for hot drink -->
  <path d="M85,42 C85,34 89,28 85,20" stroke="#d5d0c8" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.45"/>
  <path d="M95,39 C95,30 99,24 95,15" stroke="#d5d0c8" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.35"/>
  <path d="M105,39 C105,30 101,24 105,15" stroke="#d5d0c8" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.35"/>
  <path d="M115,42 C115,34 111,28 115,20" stroke="#d5d0c8" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.25"/>
  <!-- Ice cubes visible through lighter coffee -->
  <rect x="80" y="120" width="12" height="10" rx="2" fill="#ffffff" opacity="0.15" transform="rotate(8,86,125)"/>
  <rect x="105" y="130" width="14" height="11" rx="2" fill="#ffffff" opacity="0.12" transform="rotate(-5,112,135)"/>
  <rect x="90" y="160" width="11" height="9" rx="2" fill="#ffffff" opacity="0.10" transform="rotate(12,95,164)"/>
</svg>
