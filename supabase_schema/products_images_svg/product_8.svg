<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280">
  <defs>
    <linearGradient id="bg8" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF8F0"/>
      <stop offset="100%" stop-color="#F5E6D3"/>
    </linearGradient>
    <linearGradient id="tea8" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4A54A"/>
      <stop offset="100%" stop-color="#B8862D"/>
    </linearGradient>
    <linearGradient id="cup8" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F8F8F8"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8E8E8"/>
    </linearGradient>
    <linearGradient id="lemon8" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE44D"/>
      <stop offset="100%" stop-color="#FFD700"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="200" height="280" rx="16" fill="url(#bg8)"/>
  <!-- Shadow -->
  <ellipse cx="100" cy="258" rx="52" ry="8" fill="#D4C4B0" opacity="0.5"/>
