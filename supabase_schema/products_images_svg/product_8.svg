  <path d="M65 155 L67 190" stroke="#005C3B" stroke-width="0.5" opacity="0.4"/>
  <path d="M75 156 L77 192" stroke="#005C3B" stroke-width="0.5" opacity="0.4"/>
  <path d="M85 157 L86 193" stroke="#005C3B" stroke-width="0.5" opacity="0.4"/>
  <path d="M95 157 L96 193" stroke="#005C3B" stroke-width="0.5" opacity="0.4"/>
  <path d="M105 157 L106 193" stroke="#005C3B" stroke-width="0.5" opacity="0.4"/>
  <path d="M115 156 L117 192" stroke="#005C3B" stroke-width="0.5" opacity="0.4"/>
  <path d="M125 155 L127 190" stroke="#005C3B" stroke-width="0.5" opacity="0.4"/>
  <path d="M135 154 L136 188" stroke="#005C3B" stroke-width="0.5" opacity="0.4"/>
  <!-- Sleeve logo -->
  <circle cx="100" cy="172" r="18" fill="#00704A" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="100" cy="172" r="14" fill="none" stroke="#FFFFFF" stroke-width="0.5"/>
  <path d="M100 161 C97 161 94 163 94 166 C94 168 95 170 97 171 L96 178 L100 176 L104 178 L103 171 C105 170 106 168 106 166 C106 163 103 161 100 161 Z" fill="#FFFFFF" opacity="0.9"/>
