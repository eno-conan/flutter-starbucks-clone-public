  <ellipse cx="100" cy="80" rx="42" ry="8" fill="#FAFAFA"/>
  <!-- Lid -->
  <path d="M55 75 C55 65 70 58 100 58 C130 58 145 65 145 75 L145 82 C145 82 130 88 100 88 C70 88 55 82 55 82 Z" fill="#2D2D2D"/>
  <ellipse cx="100" cy="75" rx="45" ry="12" fill="#3A3A3A"/>
  <ellipse cx="100" cy="74" rx="42" ry="10" fill="#333333"/>
  <path d="M85 70 L90 66 L110 66 L115 70 L110 72 L90 72 Z" fill="#2A2A2A" stroke="#222" stroke-width="0.5"/>
