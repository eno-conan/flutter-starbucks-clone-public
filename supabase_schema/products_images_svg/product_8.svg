    <!-- Lemon segments -->
    <line x1="0" y1="-10" x2="0" y2="10" stroke="#FFE44D" stroke-width="0.8"/>
    <line x1="-10" y1="0" x2="10" y2="0" stroke="#FFE44D" stroke-width="0.8"/>
    <line x1="-7" y1="-7" x2="7" y2="7" stroke="#FFE44D" stroke-width="0.8"/>
    <line x1="7" y1="-7" x2="-7" y2="7" stroke="#FFE44D" stroke-width="0.8"/>
    <circle cx="0" cy="0" r="3" fill="#FFE44D"/>
