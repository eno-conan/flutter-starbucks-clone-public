  <!-- Starbucks sleeve -->
  <path d="M58 140 L61 200 C61 200 75 204 100 204 C125 204 139 200 139 200 L142 140 C142 140 128 144 100 144 C72 144 58 140 58 140 Z" fill="#00704A"/>
