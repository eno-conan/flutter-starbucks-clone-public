    <ellipse cx="0" cy="0" rx="14" ry="14" fill="none" stroke="#D4A017" stroke-width="2"/>
  </g>
  <!-- Steam -->
  <path d="M85 55 C85 48 79 45 82 38 C85 31 79 28 82 22" fill="none" stroke="#D4C4B0" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <path d="M97 52 C97 45 92 42 95 35 C98 28 92 25 95 18" fill="none" stroke="#D4C4B0" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
  <path d="M109 55 C109 48 115 45 112 38 C109 31 115 28 112 22" fill="none" stroke="#D4C4B0" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
