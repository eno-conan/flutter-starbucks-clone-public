<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280">
  <defs>
    <linearGradient id="cupGrad17" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f5f5f0"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8e8e3"/>
    </linearGradient>
    <linearGradient id="soyGrad17" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0e6d2"/>
      <stop offset="100%" stop-color="#c8b08a"/>
    </linearGradient>
    <linearGradient id="foamGrad17" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fefcf5"/>
      <stop offset="100%" stop-color="#f0e6d2"/>
    </linearGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="100" cy="268" rx="52" ry="8" fill="#00000015"/>
  <!-- Cup body -->
  <path d="M55,70 L62,255 C62,262 75,268 100,268 C125,268 138,262 138,255 L145,70 Z" fill="url(#cupGrad17)" stroke="#ddd" stroke-width="0.5"/>
  <!-- Drink fill - pale soy milk latte -->
  <path d="M58,85 L62,255 C62,262 75,268 100,268 C125,268 138,262 138,255 L142,85 Z" fill="url(#soyGrad17)"/>
  <!-- Espresso layer visible through pale soy -->
  <path d="M60,120 L62,255 C62,262 75,268 100,268 C125,268 138,262 138,255 L140,120 Z" fill="#c8a878" opacity="0.3"/>
  <!-- Foam layer - lighter, creamier for soy -->
  <ellipse cx="100" cy="85" rx="42" ry="12" fill="url(#foamGrad17)"/>
  <!-- Micro-foam bubbles -->
  <circle cx="90" cy="83" r="1.5" fill="#ffffff" opacity="0.4"/>
  <circle cx="95" cy="86" r="1" fill="#ffffff" opacity="0.35"/>
  <circle cx="105" cy="82" r="1.2" fill="#ffffff" opacity="0.3"/>
  <circle cx="110" cy="85" r="0.8" fill="#ffffff" opacity="0.35"/>
  <circle cx="85" cy="86" r="1" fill="#ffffff" opacity="0.3"/>
  <circle cx="100" cy="80" r="1.3" fill="#ffffff" opacity="0.35"/>
  <circle cx="113" cy="83" r="0.9" fill="#ffffff" opacity="0.3"/>
  <circle cx="88" cy="80" r="0.7" fill="#ffffff" opacity="0.25"/>
  <!-- Latte art - simple heart -->
  <path d="M96,82 Q96,78 100,80 Q104,78 104,82 Q104,86 100,89 Q96,86 96,82 Z" fill="#c8a060" opacity="0.35"/>
  <!-- Soy milk swirl lines -->
  <path d="M85,84 Q90,81 95,84" fill="none" stroke="#faf5e8" stroke-width="0.8" opacity="0.5"/>
  <path d="M105,83 Q110,80 115,84" fill="none" stroke="#faf5e8" stroke-width="0.8" opacity="0.5"/>
  <!-- Green sleeve -->
  <path d="M67,140 L73,200 C73,200 85,204 100,204 C115,204 127,200 127,200 L133,140 Z" fill="#00704A"/>
  <!-- Sleeve logo circle -->
  <circle cx="100" cy="170" r="16" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="100" cy="170" r="13" fill="none" stroke="#ffffff" stroke-width="0.5"/>
  <!-- Simplified siren -->
  <circle cx="100" cy="167" r="3" fill="#ffffff"/>
  <path d="M94,173 Q97,180 100,176 Q103,180 106,173" fill="none" stroke="#ffffff" stroke-width="1.2"/>
  <!-- SOY label on sleeve -->
  <text x="100" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#ffffff" opacity="0.7" letter-spacing="2">SOY</text>
  <!-- Cup rim -->
  <ellipse cx="100" cy="70" rx="45" ry="13" fill="#f0f0eb" stroke="#ddd" stroke-width="0.5"/>
  <ellipse cx="100" cy="70" rx="42" ry="11" fill="#ffffff" stroke="#eee" stroke-width="0.3"/>
  <!-- Lid -->
  <path d="M58,65 C58,55 75,48 100,48 C125,48 142,55 142,65" fill="#e0ddd5" stroke="#c5c2ba" stroke-width="0.5"/>
  <ellipse cx="100" cy="65" rx="42" ry="11" fill="#eae7df" stroke="#c5c2ba" stroke-width="0.5"/>
  <!-- Lid drinking hole -->
  <ellipse cx="100" cy="58" rx="8" ry="3" fill="#d5d0c5" stroke="#b5b0a5" stroke-width="0.5"/>
  <!-- Cup highlight -->
  <path d="M70,90 L73,240 C73,240 74,242 75,242" fill="#ffffff" opacity="0.15"/>
</svg>