<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280">
  <defs>
    <linearGradient id="cupBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0ece6"/>
    </linearGradient>
    <linearGradient id="espresso" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b1e0e"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <linearGradient id="crema" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8954a"/>
      <stop offset="40%" stop-color="#b5802e"/>
      <stop offset="100%" stop-color="#a06e22"/>
    </linearGradient>
    <linearGradient id="saucerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8e2d8"/>
    </linearGradient>
  </defs>
  <!-- Shadow beneath saucer -->
  <ellipse cx="100" cy="248" rx="65" ry="10" fill="rgba(0,0,0,0.10)"/>
  <!-- Saucer -->
  <ellipse cx="100" cy="238" rx="65" ry="12" fill="url(#saucerGrad)" stroke="#ddd5c8" stroke-width="1"/>
  <ellipse cx="100" cy="236" rx="55" ry="9" fill="#f8f4ee" stroke="#e8e0d5" stroke-width="0.5"/>
  <ellipse cx="100" cy="235" rx="35" ry="6" fill="#f0ece5" stroke="#e0d8cc" stroke-width="0.5"/>
  <!-- Cup body - small demitasse -->
  <path d="M72,145 L68,228 C68,233 78,237 100,237 C122,237 132,233 132,228 L128,145 Z" fill="url(#cupBody)" stroke="#e0d8cc" stroke-width="1"/>
  <!-- Starbucks green band -->
  <path d="M74,175 L72,210 C72,210 80,214 100,214 C120,214 128,210 128,210 L126,175 C126,175 118,179 100,179 C82,179 74,175 74,175 Z" fill="#00704A"/>
  <!-- Logo on band -->
  <circle cx="100" cy="194" r="12" fill="#00704A" stroke="#ffffff" stroke-width="1.2"/>
  <circle cx="100" cy="194" r="9" fill="none" stroke="#ffffff" stroke-width="0.4"/>
  <path d="M100,186 C98,186 96.5,187.5 96.5,189.5 C96.5,191.5 97.5,193 99,194.5 C97.5,196 96.5,197.5 96.5,199 C96.5,200.5 98,201.5 100,201.5 C102,201.5 103.5,200.5 103.5,199 C103.5,197.5 102.5,196 101,194.5 C102.5,193 103.5,191.5 103.5,189.5 C103.5,187.5 102,186 100,186 Z" fill="#ffffff" opacity="0.9"/>
  <!-- Espresso fill -->
  <path d="M74,155 L70,224 C70,229 80,233 100,233 C120,233 130,229 130,224 L126,155 C126,155 118,159 100,159 C82,159 74,155 74,155 Z" fill="url(#espresso)"/>
  <!-- Crema layer -->
  <path d="M74,148 L74,158 C74,158 82,162 100,162 C118,162 126,158 126,158 L126,148 C126,148 118,152 100,152 C82,152 74,148 74,148 Z" fill="url(#crema)"/>
  <!-- Crema surface -->
  <ellipse cx="100" cy="148" rx="27" ry="6" fill="#c8954a"/>
  <ellipse cx="100" cy="148" rx="25" ry="5" fill="#d4a050" opacity="0.6"/>
  <!-- Crema highlights -->
  <ellipse cx="93" cy="147" rx="6" ry="2" fill="#dab068" opacity="0.5"/>
  <ellipse cx="108" cy="149" rx="4" ry="1.5" fill="#dab068" opacity="0.4"/>
  <!-- Cup rim -->
  <ellipse cx="100" cy="145" rx="30" ry="7" fill="#f5f0e8" stroke="#e0d8cc" stroke-width="1"/>
  <ellipse cx="100" cy="145" rx="27" ry="6" fill="#ffffff"/>
  <!-- Cup handle -->
  <path d="M132,165 C148,165 152,180 152,195 C152,210 148,218 132,218" fill="none" stroke="#e0d8cc" stroke-width="5" stroke-linecap="round"/>
  <path d="M132,165 C145,165 149,180 149,195 C149,210 145,218 132,218" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <!-- Steam -->
  <path d="M90,132 C90,125 94,120 90,112" stroke="#d0ccc5" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.5"/>
  <path d="M100,130 C100,122 104,117 100,108" stroke="#d0ccc5" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.4"/>
  <path d="M110,132 C110,125 106,120 110,112" stroke="#d0ccc5" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.3"/>
</svg>
