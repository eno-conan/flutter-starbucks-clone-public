<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="372" viewBox="0 0 1050 372" role="img" aria-label="認証情報の実物は、サンドボックスの外にだけ置く">
<title>認証情報の実物は、サンドボックスの外にだけ置く</title>
<desc>サンドボックスの環境変数には代替値だけがある。git が代替値をヘッダーに載せて送ると、ゲートウェイ側のプロキシが宛先を照合し、認証情報にひも付く宛先のときだけ実物に差し替えて転送する。それ以外の宛先には実物が渡らない。</desc>
<defs><marker id="a-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="a-ok_s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a-ng_s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a-box_s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker></defs>
<rect x="0.5" y="0.5" width="1049" height="371" rx="12" fill="#ffffff" stroke="#d1d5db"/>
<g transform="translate(0,-44)">
<rect x="14" y="74" width="430" height="290" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="28" y="96" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">サンドボックス</text>
<rect x="584" y="74" width="250" height="290" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="598" y="96" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="12" fill="#6b7280" text-anchor="start">ゲートウェイ側（サンドボックスの外）</text>
<rect x="30" y="212" width="172" height="76" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
<text x="116.0" y="235.9" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">環境変数</text>
<text x="116.0" y="254.2" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace,'Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">GITHUB_TOKEN=opensh…</text>
<text x="116.0" y="273.2" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">実物は無い（代替値）</text>
<rect x="252" y="212" width="180" height="76" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
<text x="342.0" y="235.9" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">git / gh</text>
<text x="342.0" y="254.6" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">代替値をヘッダーに</text>
<text x="342.0" y="273.6" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">載せて送る</text>
<polyline points="202,250 252,250" fill="none" stroke="#374151" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-line)"/>
<text x="227" y="240" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" stroke="#f9fafb" stroke-width="4" stroke-linejoin="round" paint-order="stroke">読む</text>
<rect x="600" y="108" width="218" height="64" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="709.0" y="135.4" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">保管庫（provider）</text>
<text x="709.0" y="153.7" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace,'Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">GITHUB_TOKEN=実物</text>
<rect x="600" y="212" width="218" height="76" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="709.0" y="235.9" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">プロキシ</text>
<text x="709.0" y="254.6" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">宛先を照合する</text>
<text x="709.0" y="273.2" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">一致 → 実物に差し替え</text>
<polyline points="709,172 709,212" fill="none" stroke="#374151" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-line)"/>
<text x="718" y="196" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="12" fill="#6b7280" text-anchor="start" stroke="#eff6ff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">一致したときだけ</text>
<polyline points="432,250 600,250" fill="none" stroke="#374151" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-line)"/>
<text x="516" y="238" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">代替値つきで送る</text>
<text x="516" y="272" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace" font-size="12" fill="#6b7280" text-anchor="middle">Bearer opensh…</text>
<rect x="900" y="212" width="130" height="76" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="965.0" y="235.6" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace,'Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">api.github.com</text>
<text x="965.0" y="254.2" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">ひも付く宛先</text>
<text x="965.0" y="273.2" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace,'Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">Bearer 実物</text>
<polyline points="818,250 900,250" fill="none" stroke="#16a34a" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-ok_s)"/>
<text x="859" y="240" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">実物を注入</text>
<rect x="900" y="304" width="130" height="60" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="965.0" y="329.1" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">それ以外の宛先</text>
<text x="965.0" y="347.7" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="12" fill="#991b1b" text-anchor="middle">実物は渡らない</text>
<polyline points="709,288 709,334 898,334" fill="none" stroke="#dc2626" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-ng_s)"/>
<text x="800" y="324" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">宛先が違う: 拒否</text>
<text x="525" y="398" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">サンドボックスの中には代替値しか無い。実物は、ひも付く宛先への通信にだけ付く</text>
</g>
</svg>
