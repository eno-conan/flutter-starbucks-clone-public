<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ユーザー会員登録フロー - BPMN Viewer</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #f5f5f5;
      }
      header {
        background: #00704a;
        color: #fff;
        padding: 10px 20px;
        display: flex;
        align-items: center;
        gap: 12px;
        height: 52px;
      }
      header h1 {
        font-size: 17px;
        font-weight: 600;
        line-height: 1.3;
      }
      header p {
        font-size: 12px;
        opacity: 0.8;
        margin-top: 2px;
      }
      header .spacer { flex: 1; }
      #btn-svg,
      #btn-download {
        background: transparent;
        border: 1px solid rgba(255,255,255,0.7);
        color: #fff;
        padding: 6px 14px;
        font-size: 13px;
        border-radius: 4px;
        cursor: pointer;
        white-space: nowrap;
      }
      #btn-svg:hover,
      #btn-download:hover { background: rgba(255,255,255,0.15); }
      #canvas {
        width: 100%;
        height: calc(100vh - 52px);
        background: #fff;
        position: relative;
      }
      #loading {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #888;
        font-size: 14px;
      }
      #error-msg {
        display: none;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #c62828;
        font-size: 14px;
        text-align: center;
        padding: 20px 24px;
        background: #fff;
        border: 1px solid #c62828;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>ユーザー会員登録フロー</h1>
        <p>仮登録 + 本登録の2段階フロー（Issue #782 おためし）</p>
      </div>
      <div class="spacer"></div>
      <button id="btn-svg">SVGをダウンロード</button>
      <button id="btn-download">XMLをダウンロード</button>
    </header>
    <div id="canvas">
      <div id="loading">BPMN 図を読み込んでいます...</div>
      <div id="error-msg"></div>
    </div>
  </body>
</html>
